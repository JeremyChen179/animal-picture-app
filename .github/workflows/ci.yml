name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: Build & test (Maven, JDK 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and run tests
        run: ./mvnw -B verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: target/surefire-reports/

      - name: Upload executable jar
        uses: actions/upload-artifact@v7
        with:
          name: animal-picture-app-jar
          path: target/animal-picture-app-*.jar

  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image (runs the tests again inside the build stage)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: animal-picture-app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
