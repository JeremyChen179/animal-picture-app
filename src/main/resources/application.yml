server:
  port: ${PORT:8080}

spring:
  application:
    name: animal-picture-app
  datasource:
    # Embedded SQLite database file, created automatically on first start. Override with DB_URL.
    url: ${DB_URL:jdbc:sqlite:./data/pictures.db}
    driver-class-name: org.sqlite.JDBC
    hikari:
      # SQLite allows a single writer at a time; one connection avoids "database is locked" errors.
      maximum-pool-size: 1
  sql:
    init:
      # Run schema.sql on every start (it only uses CREATE ... IF NOT EXISTS).
      mode: always

management:
  endpoints:
    web:
      exposure:
        # Only the health endpoint over HTTP (also Spring Boot's default); details stay hidden.
        include: health

app:
  cors:
    # Origins allowed to call /api/** from a browser, for a UI hosted elsewhere.
    # The built-in UI at / is served by this app (same origin) and doesn't need CORS.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

pictures:
  min-size: 200
  max-size: 600
  # Per-source circuit breaker: after N failures in a row a source is skipped for open-duration,
  # so requests go straight to the backup instead of waiting for timeouts. Then one trial call is let through.
  circuit-breaker:
    failure-threshold: 2
    open-duration: 60s
  # Larger downloads are aborted (checked against Content-Length and while reading).
  max-image-size: 10MB
  # Tried in order per animal; the next source is used if one fails, times out or returns no image.
  # Image sources return the picture directly. JSON sources (image-url-path set) return JSON
  # containing the picture URL, which is then downloaded.
  # Placeholders: {width}/{height} = random size, {random} = random number from 1 to random-max.
  # JSON sources must list allowed-image-hosts: the image URL comes from a third party, so it may
  # only point to these https hosts.
  sources:
    CAT:
      # placekitten.com (from the brief) is offline (HTTP 521).
      - url: https://cataas.com/cat?width={width}&height={height}
      - url: https://placecats.com/{width}/{height}
    DOG:
      - url: https://place.dog/{width}/{height}
      - url: https://placedog.net/{width}/{height}
      - url: https://dog.ceo/api/breeds/image/random
        image-url-path: /message
        allowed-image-hosts: [images.dog.ceo]
    BEAR:
      - url: https://placebear.com/{width}/{height}
      # iNaturalist research-grade bear observations (taxon 41636 = Ursidae) with openly licensed
      # photos only; a random results page gives a random bear. ~7,180 matches as of Oct 2026.
      - url: https://api.inaturalist.org/v1/observations?taxon_id=41636&photos=true&quality_grade=research&photo_license=cc0,cc-by,cc-by-sa&per_page=1&page={random}
        random-max: 7000
        image-url-path: /results/0/photos/0/url
        # The API returns a 75 px thumbnail URL; use the medium size instead.
        image-url-find: /square.
        image-url-replace: /medium.
        allowed-image-hosts: [inaturalist-open-data.s3.amazonaws.com, static.inaturalist.org]
