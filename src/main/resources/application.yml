server:
  port: ${PORT:8080}

spring:
  application:
    name: animal-picture-app
  datasource:
    # Embedded SQLite database file, created automatically on first start. Override with DB_URL.
    url: ${DB_URL:jdbc:sqlite:./data/pictures.db}
    driver-class-name: org.sqlite.JDBC
    hikari:
      # SQLite allows a single writer at a time; one connection avoids "database is locked" errors.
      maximum-pool-size: 1
  sql:
    init:
      # Run schema.sql on every start (it only uses CREATE ... IF NOT EXISTS).
      mode: always

app:
  cors:
    # Origins allowed to call /api/** from a browser, for a UI hosted elsewhere.
    # The built-in UI at / is served by this app (same origin) and doesn't need CORS.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

pictures:
  min-size: 200
  max-size: 600
  # Tried in order per animal; the next source is used if one fails or times out.
  sources:
    # placekitten.com is offline (HTTP 521), so cats come from cataas.com, with placecats.com as backup.
    CAT:
      - https://cataas.com/cat?width={width}&height={height}
      - https://placecats.com/{width}/{height}
    DOG:
      - https://place.dog/{width}/{height}
    BEAR:
      - https://placebear.com/{width}/{height}
