<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Animal Pictures</title>
  <style>
    body { font-family: sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
    fieldset { margin-bottom: 1rem; }
    #gallery img { max-width: 260px; margin: 4px; border: 1px solid #ccc; }
    #status { margin: 1rem 0; }
    .error { color: #b00020; }
  </style>
</head>
<body>
  <h1>Animal Pictures</h1>

  <fieldset>
    <legend>Fetch and save new pictures</legend>
    <label>Animal
      <select id="animal">
        <option value="cat">Cat</option>
        <option value="dog">Dog</option>
        <option value="bear">Bear</option>
      </select>
    </label>
    <label>Count <input id="count" type="number" min="1" max="10" value="1"></label>
    <button id="fetch">Fetch &amp; save</button>
    <button id="last">Show last saved of this animal</button>
    <button id="latest">Show latest of any animal</button>
  </fieldset>

  <div id="status"></div>
  <div id="gallery"></div>

  <script>
    const statusEl = document.getElementById('status');
    const gallery = document.getElementById('gallery');
    const animal = () => document.getElementById('animal').value;

    function setStatus(text, isError) {
      statusEl.textContent = text;
      statusEl.className = isError ? 'error' : '';
    }

    function showImages(urls) {
      gallery.innerHTML = '';
      urls.forEach(url => {
        const img = document.createElement('img');
        img.src = url;
        gallery.appendChild(img);
      });
    }

    async function errorText(response) {
      try { return (await response.json()).detail || response.statusText; }
      catch { return response.statusText; }
    }

    document.getElementById('fetch').addEventListener('click', async () => {
      const count = Number(document.getElementById('count').value);
      setStatus('Fetching ' + count + ' ' + animal() + ' picture(s)...');
      const response = await fetch('/api/pictures', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ animal: animal(), count })
      });
      if (!response.ok) { setStatus('Error: ' + await errorText(response), true); return; }
      const saved = await response.json();
      setStatus('Saved ' + saved.length + ' picture(s) from ' + [...new Set(saved.map(p => p.sourceWebsite))].join(', ')
        + ': ids ' + saved.map(p => p.id).join(', '));
      showImages(saved.map(p => p.imageUrl));
    });

    async function showStored(metadataUrl) {
      const response = await fetch(metadataUrl);
      if (!response.ok) { setStatus('Error: ' + await errorText(response), true); gallery.innerHTML = ''; return; }
      const picture = await response.json();
      setStatus(picture.animalType + ' #' + picture.id + ' from ' + picture.sourceWebsite + ', fetched ' + picture.createdAt);
      showImages([picture.imageUrl]);
    }

    document.getElementById('last').addEventListener('click', () => showStored('/api/pictures/' + animal() + '/last/metadata'));
    document.getElementById('latest').addEventListener('click', () => showStored('/api/pictures/latest/metadata'));
  </script>
</body>
</html>
